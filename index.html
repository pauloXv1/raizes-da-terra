<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Raizes da Terra</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="/image/favicon-32.png" sizes="32x32">
    <link rel="shortcut icon" href="/image/favicon-32.png">
    <link rel="apple-touch-icon" href="/image/icon-central.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4CAF50">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-header">
                <img src="/image/goku-vegeta.gif" alt="Logo">
                <h1>Raizes da Terra</h1>
                <p>Sistema de Vendas</p>
            </div>

            <div class="login-body">
                <h2>🔐 Entrar no Sistema</h2>

                <div class="alert-error" id="alertError">
                    ❌ Usuário ou senha incorretos.
                </div>

                <form id="loginForm" autocomplete="off">
                    <div class="form-group">
                        <label for="username">Usuário</label>
                        <div class="input-wrapper">
                            <span class="icon">👤</span>
                            <input
                                type="text"
                                id="username"
                                placeholder="Digite seu usuário"
                                autocomplete="username"
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <div class="input-wrapper">
                            <span class="icon">🔒</span>
                            <input
                                type="password"
                                id="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="toggle-password" id="toggleBtn" title="Mostrar/ocultar senha">👁️</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="btnLogin">
                        Entrar
                    </button>
                </form>
            </div>

            <div class="login-footer">
                Raizes da Terra © 2025
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
