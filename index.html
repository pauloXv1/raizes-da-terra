<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Raízes da Terra</title>
<link rel="icon" href="assets/images/favicon-32.png">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<main class="login">
<section class="panel">
<p class="muted">RAÍZES DA TERRA</p>
<h1>Bem-vindo</h1>
<p>Entre para consultar os preços atualizados.</p>
<form id="loginForm">
<label for="email">E-mail<input id="email" type="email" autocomplete="username" required>
</label>
<label for="password">Senha<input id="password" type="password" autocomplete="current-password" required>
</label>
<button type="button" id="toggleBtn" class="secondary">Mostrar / ocultar senha</button>
<p id="status" role="status" aria-live="polite">
</p>
<button id="btnLogin" type="submit">Entrar</button>
</form>
<p class="muted">Precisa de acesso ou esqueceu a senha? Fale com um administrador.</p>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>
<script src="assets/js/config.js">
</script>
<script src="assets/js/auth.js">
</script>
<script src="assets/js/login.js">
</script>
</body>
</html>
